<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#171715" />
    <meta name="description" content="3DHR Training — workshop online ao vivo de inteligência artificial aplicada à arquitetura: curadoria ancorada, modelação agêntica no Rhino sob supervisão, imagem fiel à geometria e movimento. 10 e 12 de novembro de 2026." />
    <meta name="author" content="3DHR Training — Arquiteto Ivo Garcia" />
    <!-- O formador entra nos metadados, e nao so no corpo da pagina: e' a prova
         de que o tema e' ensinado por alguem com credencial propria. O
         schema.org Person permite ainda ao Google mostrar o perfil em rich
         results. Nao ha datas deInicio/fim porque nao sao confirmadas. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ivo Garcia",
        "jobTitle": "Arquiteto e formador",
        "description": "V-Ray Mentor da Chaos Group em Portugal, professor na Escola Superior de Artes e Design, pós-graduado em Arquitetura Digital e formador convidado da Ordem dos Arquitectos em Inteligência Artificial na Arquitetura.",
        "image": "/media/mentor-ivo-garcia.webp",
        "worksFor": { "@type": "Organization", "name": "3DHR Training" },
        "alumniOf": { "@type": "EducationalOrganization", "name": "Escola Superior de Artes e Design" },
        "memberOf": { "@type": "Organization", "name": "Ordem dos Arquitectos" }
      }
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="3DHR Training" />
    <meta property="og:title" content="3DHR Training — dá forma ao que ainda não existe" />
    <meta property="og:description" content="A IA entra sobre um modelo mensurável no Rhino e sob o teu controlo: do conceito à geometria válida, à imagem fiel e ao movimento. Na 3DHR Training a qualidade de ensino é a nossa excelência." />
    <meta property="og:image" content="/media/motion-context-poster.webp" />
    <meta property="og:locale" content="pt_PT" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>3DHR Training — dá forma ao que ainda não existe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics é opcional: o loader só corre quando as duas variáveis existem.
         Um placeholder não substituído ainda contém "%", por isso é ignorado. -->
    <script>
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";

        if (!endpoint || endpoint.indexOf("%") !== -1 || !websiteId || websiteId.indexOf("%") !== -1) {
          return;
        }

        var script = document.createElement("script");
        script.defer = true;
        script.src = endpoint.replace(/\/+$/, "") + "/umami";
        script.setAttribute("data-website-id", websiteId);
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
